# Existing HTTPS ingress reaches the loopback published frontend port through
# the fixed Docker gateway. Only that hop may supply forwarding headers.
geo $matrix_trusted_ingress {
    default 0;
    172.30.83.1 1;
}
map "$matrix_trusted_ingress:$http_x_forwarded_proto" $matrix_protocol {
    default $scheme;
    "1:https" https;
}
map "$matrix_trusted_ingress:$http_x_forwarded_for" $matrix_client {
    default $remote_addr;
    ~^1:(.+)$ $1;
}
map $http_upgrade $matrix_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 256m;
    add_header X-Content-Type-Options nosniff always;
    location ~ /\.(?!well-known) { return 404; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $matrix_protocol;
    proxy_set_header X-Forwarded-For $matrix_client;
    proxy_set_header X-Real-IP $matrix_client;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $matrix_connection;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    location /api { proxy_pass http://backend:4174; }
    location /mcp { proxy_pass http://backend:4174; }
    location / { try_files $uri $uri/ /index.html; }
}
