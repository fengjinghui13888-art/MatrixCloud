# Standalone ingress survives business container replacement and rollback.
# Replace ${SERVER_NAME}, ${TLS_DATA_DIR} before deployment.
map $http_upgrade $matrix_connection { default upgrade; '' close; }
server {
    listen 80 default_server;
    server_name ${SERVER_NAME};
    server_tokens off;
    autoindex off;
    location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
        root /var/lib/matrix-acme/webroot;
        default_type text/plain;
        disable_symlinks on;
        try_files $uri =404;
        limit_except GET { deny all; }
    }
    location / { return 308 https://${SERVER_NAME}$request_uri; }
}
server {
    listen 443 ssl;
    server_name ${SERVER_NAME};
    ssl_certificate ${TLS_DATA_DIR}/fullchain.pem;
    ssl_certificate_key ${TLS_DATA_DIR}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    # Keep media uploads usable while bounding accidental or abusive requests.
    # Large original media is uploaded through the application in chunks.
    client_max_body_size 256m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $matrix_connection;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    location /maintenance/ { proxy_pass http://127.0.0.1:4176; }
    location /.well-known/oauth { proxy_pass http://127.0.0.1:4176; }
    location ~ ^/(authorize|token|revoke)$ { proxy_pass http://127.0.0.1:4176; }
    location ~ ^/\.(git|env)(/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
