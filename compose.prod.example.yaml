services:
  app:
    image: matrix-cloud:<release-tag>
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/work/grey
      NODE_ENV: production
    volumes:
      - matrix-app:/app/work
    expose:
      - "4174"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:4174/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.postgres
    volumes:
      - matrix-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-matrix}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  matrix-app:
  matrix-postgres:
